name: D1 read replication

# Checks the D1 Sessions API with read replication on a throwaway database, then
# (when asked) turns read replication on for the production database.
# Uses the repository secrets CLOUDFLARE_API_TOKEN (D1 and Workers Scripts: Edit)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      enable_production:
        description: Turn on read replication for the production database after the check passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check sessions on a test database
    runs-on: ubuntu-latest
    # The Cloudflare secrets are the production environment's.
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: diffinery-d1-probe-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create a test database with read replication
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          id=$(curl -sS -X POST "$API/d1/database" "${auth[@]}" --data "{\"name\":\"$NAME\"}" | jq -r '.result.uuid // empty')
          [ -n "$id" ] || { echo "::error::could not create the test database"; exit 1; }
          echo "D1_ID=$id" >> "$GITHUB_ENV"
          curl -sS -X PUT "$API/d1/database/$id" "${auth[@]}" --data '{"read_replication":{"mode":"auto"}}' | jq -e '.success' >/dev/null
          mode=$(curl -sS "$API/d1/database/$id" "${auth[@]}" | jq -r '.result.read_replication.mode')
          echo "read replication on the test database: $mode"
          [ "$mode" = auto ] || { echo "::error::read replication did not turn on"; exit 1; }
      - name: Deploy the probe Worker
        working-directory: scripts/d1-probe
        run: |
          set -euo pipefail
          cat > wrangler.json <<JSON
          {"name":"$NAME","main":"worker.js","compatibility_date":"2026-10-01","workers_dev":true,
           "d1_databases":[{"binding":"DB","database_name":"$NAME","database_id":"$D1_ID"}]}
          JSON
          W=(pnpm --dir "$GITHUB_WORKSPACE/apps/diffinery" exec wrangler)
          "${W[@]}" d1 execute "$NAME" --remote -c "$PWD/wrangler.json" --command "CREATE TABLE probe (k TEXT PRIMARY KEY, v TEXT NOT NULL)"
          "${W[@]}" deploy -c "$PWD/wrangler.json"
          sub=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::the account has no workers.dev subdomain"; exit 1; }
          echo "PROBE_URL=https://$NAME.$sub.workers.dev" >> "$GITHUB_ENV"
      - name: Read your own writes through bookmarks
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            body=$(curl -sS "$PROBE_URL/check?rounds=25") && jq -e . >/dev/null <<<"$body" && break
            sleep 5
          done
          echo "$body" | jq .
          jq -e '.ok' >/dev/null <<<"$body" || { echo "::error::a read after a bookmark missed the write, or a query failed"; exit 1; }
          echo "every read from a bookmark saw its write ($(jq -r '.replicaReads' <<<"$body") served by replicas)"
      - name: Remove the probe and the test database
        if: always()
        run: |
          cd scripts/d1-probe
          [ -f wrangler.json ] && pnpm --dir "$GITHUB_WORKSPACE/apps/diffinery" exec wrangler delete -c "$PWD/wrangler.json" --force || true
          [ -n "${D1_ID:-}" ] && curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_ID" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -c '{success}' || true

  enable:
    name: Turn on read replication in production
    needs: check
    if: ${{ inputs.enable_production }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DIFFINERY_DOMAIN || 'diffinery.com' }}
    env:
      DIFFINERY_DOMAIN: ${{ vars.DIFFINERY_DOMAIN || 'diffinery.com' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Enable and verify
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          id=$(curl -sS "$API/d1/database?name=diffinery&per_page=100" "${auth[@]}" | jq -r '.result[]? | select(.name=="diffinery") | .uuid' | head -n1)
          [ -n "$id" ] || { echo "::error::production database not found"; exit 1; }
          curl -sS -X PUT "$API/d1/database/$id" "${auth[@]}" --data '{"read_replication":{"mode":"auto"}}' | jq -e '.success' >/dev/null
          mode=$(curl -sS "$API/d1/database/$id" "${auth[@]}" | jq -r '.result.read_replication.mode')
          echo "read replication on diffinery: $mode"
          [ "$mode" = auto ] || { echo "::error::read replication did not turn on"; exit 1; }
      - name: Check the site still reads and writes
        run: |
          set -euo pipefail
          for p in /healthz /login /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$DIFFINERY_DOMAIN$p"); echo "$p -> $code"; [ "$code" = 200 ]
          done
          bm=$(curl -sS -D - -o /dev/null https://$DIFFINERY_DOMAIN/sitemap.xml | tr -d '\r' | sed -n 's/^x-d1-bookmark: //Ip')
          echo "x-d1-bookmark: $bm"; [ -n "$bm" ]
